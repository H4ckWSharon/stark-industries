version: '3.9'

# =============================================================
# STARK INDUSTRIES SQL — Docker Compose
# Educational cybersecurity training platform.
# FOR AUTHORIZED EDUCATIONAL USE ONLY.
# =============================================================

networks:
  stark-frontend:
    driver: bridge
  stark-backend:
    driver: bridge
  stark-challenges:
    driver: bridge
  stark-oob:
    driver: bridge
    internal: true   # No external access for OOB network

volumes:
  postgres-platform-data:
  mysql-challenge-data:
  postgres-challenge-data:
  mssql-challenge-data:
  redis-data:

services:

  # ─────────────────────────────────────────────
  # FRONTEND — React + TypeScript + Tailwind
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stark-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-8000}
      - VITE_WS_URL=ws://localhost:${BACKEND_PORT:-8000}
    networks:
      - stark-frontend
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────
  # BACKEND — FastAPI
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stark-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Docker SDK for lab management
      - ./backend:/app
    networks:
      - stark-frontend
      - stark-backend
      - stark-challenges
    depends_on:
      postgres-platform:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────
  # PLATFORM DATABASE — PostgreSQL
  # ─────────────────────────────────────────────
  postgres-platform:
    image: postgres:15-alpine
    container_name: stark-postgres-platform
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stark_platform}
      POSTGRES_USER: ${POSTGRES_USER:-stark_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stark_db_password_lab}
    volumes:
      - postgres-platform-data:/var/lib/postgresql/data
      - ./backend/init-platform-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - stark-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stark_user} -d ${POSTGRES_DB:-stark_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # REDIS — Session / Rate Limiting / Events
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: stark-redis
    volumes:
      - redis-data:/data
    networks:
      - stark-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────
  # CHALLENGE DATABASES
  # ─────────────────────────────────────────────
  mysql-challenge:
    image: mysql:8.0
    container_name: stark-mysql-challenge
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_mysql_lab_pw}
      MYSQL_DATABASE: ${MYSQL_DB:-stark_lab}
      MYSQL_USER: ${MYSQL_USER:-lab_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lab_mysql_password}
    volumes:
      - mysql-challenge-data:/var/lib/mysql
      - ./challenges/shared/mysql-seed.sql:/docker-entrypoint-initdb.d/seed.sql
    networks:
      - stark-challenges
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_mysql_lab_pw}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-challenge:
    image: postgres:15-alpine
    container_name: stark-postgres-challenge
    environment:
      POSTGRES_DB: ${PGSQL_CHALLENGE_DB:-stark_challenge_db}
      POSTGRES_USER: ${PGSQL_CHALLENGE_USER:-challenge_user}
      POSTGRES_PASSWORD: ${PGSQL_CHALLENGE_PASSWORD:-challenge_pg_password}
    volumes:
      - postgres-challenge-data:/var/lib/postgresql/data
      - ./challenges/shared/postgres-seed.sql:/docker-entrypoint-initdb.d/seed.sql
    networks:
      - stark-challenges
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGSQL_CHALLENGE_USER:-challenge_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mssql-challenge:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: stark-mssql-challenge
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${MSSQL_SA_PASSWORD:-StarkLab@Sql2024!}
      MSSQL_PID: Express
    volumes:
      - mssql-challenge-data:/var/opt/mssql
    networks:
      - stark-challenges
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD:-StarkLab@Sql2024!}' -Q 'SELECT 1' -No 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ─────────────────────────────────────────────
  # OOB LISTENER — Challenge 07 internal callback
  # ─────────────────────────────────────────────
  oob-listener:
    build:
      context: ./oob-listener
      dockerfile: Dockerfile
    container_name: stark-oob-listener
    networks:
      - stark-oob
      - stark-challenges
    restart: unless-stopped
    environment:
      - OOB_PORT=8888
      - REDIS_URL=${REDIS_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 15s
      timeout: 5s
      retries: 3

