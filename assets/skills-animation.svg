<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 70" width="100%" height="70">
  <defs>
    <filter id="pill-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes float-1 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes float-2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
    @keyframes float-3 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes float-4 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
    @keyframes float-5 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    
    .f1 { animation: float-1 3s ease-in-out infinite; }
    .f2 { animation: float-2 3.4s ease-in-out infinite 0.3s; }
    .f3 { animation: float-3 2.8s ease-in-out infinite 0.6s; }
    .f4 { animation: float-4 3.2s ease-in-out infinite 0.9s; }
    .f5 { animation: float-5 3.5s ease-in-out infinite 0.4s; }

    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 13px;
    }
  </style>

  <!-- Transparent Background: Works on Dark & Light Mode -->

  <!-- Pill 1: Ethical Hacker -->
  <g class="f1" transform="translate(10, 16)">
    <rect width="150" height="36" rx="18" fill="#E62429" fill-opacity="0.12" stroke="#E62429" stroke-width="1.8" filter="url(#pill-glow)"/>
    <text x="75" y="23" text-anchor="middle" fill="#E62429">🛡️ Ethical Hacker</text>
  </g>

  <!-- Pill 2: Pentester -->
  <g class="f2" transform="translate(175, 16)">
    <rect width="130" height="36" rx="18" fill="#FFB800" fill-opacity="0.12" stroke="#FFB800" stroke-width="1.8" filter="url(#pill-glow)"/>
    <text x="65" y="23" text-anchor="middle" fill="#FFB800">🎯 Pentester</text>
  </g>

  <!-- Pill 3: CTF Player -->
  <g class="f3" transform="translate(320, 16)">
    <rect width="135" height="36" rx="18" fill="#00A8FF" fill-opacity="0.12" stroke="#00A8FF" stroke-width="1.8" filter="url(#pill-glow)"/>
    <text x="67" y="23" text-anchor="middle" fill="#00A8FF">🚩 CTF Player</text>
  </g>

  <!-- Pill 4: Web Developer -->
  <g class="f4" transform="translate(470, 16)">
    <rect width="160" height="36" rx="18" fill="#00D47E" fill-opacity="0.12" stroke="#00D47E" stroke-width="1.8" filter="url(#pill-glow)"/>
    <text x="80" y="23" text-anchor="middle" fill="#00D47E">💻 Web Developer</text>
  </g>

  <!-- Pill 5: Hardware Hacking -->
  <g class="f5" transform="translate(645, 16)">
    <rect width="190" height="36" rx="18" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-width="1.8" filter="url(#pill-glow)"/>
    <text x="95" y="23" text-anchor="middle" fill="#FF6B00">🔌 Hardware Hacking</text>
  </g>
</svg>
