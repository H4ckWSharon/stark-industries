<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="140" height="140">
  <defs>
    <!-- Glow filter -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-core" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="core-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#00F0FF" />
      <stop offset="80%" stop-color="#0066AA" />
      <stop offset="100%" stop-color="#05101E" />
    </radialGradient>
    <radialGradient id="ring-glow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="85%" stop-color="#00F0FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF2244" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes spin-cw {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spin-ccw {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    @keyframes pulse-energy {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes flicker {
      0%, 100% { opacity: 0.95; }
      25% { opacity: 0.8; }
      50% { opacity: 1; }
      75% { opacity: 0.85; }
    }
    .spin-ring {
      transform-origin: 80px 80px;
      animation: spin-cw 12s linear infinite;
    }
    .spin-coils {
      transform-origin: 80px 80px;
      animation: spin-ccw 20s linear infinite;
    }
    .core-pulse {
      transform-origin: 80px 80px;
      animation: pulse-energy 2.5s ease-in-out infinite, flicker 0.15s infinite;
    }
    .ambient-glow {
      transform-origin: 80px 80px;
      animation: pulse-energy 4s ease-in-out infinite;
    }
  </style>

  <!-- Ambient background glow -->
  <circle cx="80" cy="80" r="70" fill="url(#ring-glow)" class="ambient-glow" />

  <!-- Outer Dark Bezel -->
  <circle cx="80" cy="80" r="74" fill="#06090e" stroke="#1c2430" stroke-width="2.5" />
  <circle cx="80" cy="80" r="68" fill="none" stroke="#FF2244" stroke-width="1" opacity="0.6" />

  <!-- Rotating dashed segment ring -->
  <g class="spin-ring">
    <circle cx="80" cy="80" r="62" fill="none" stroke="#00F0FF" stroke-width="2" stroke-dasharray="14 8 4 8" filter="url(#glow-cyan)" opacity="0.85" />
    <circle cx="80" cy="80" r="54" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="6 12 18 6" opacity="0.7" />
  </g>

  <!-- Energy Induction Coils (10 coils) -->
  <g class="spin-coils">
    <circle cx="80" cy="80" r="46" fill="none" stroke="#0e1722" stroke-width="8" />
    <!-- 10 segments -->
    <rect x="76" y="28" width="8" height="12" rx="2" fill="#00D4FF" filter="url(#glow-cyan)" opacity="0.9" />
    <rect x="76" y="28" width="8" height="12" rx="2" fill="#00D4FF" transform="rotate(36 80 80)" filter="url(#glow-cyan)" opacity="0.9" />
    <rect x="76" y="28" width="8" height="12" rx="2" fill="#00D4FF" transform="rotate(72 80 80)" filter="url(#glow-cyan)" opacity="0.9" />
    <rect x="76" y="28" width="8" height="12" rx="2" fill="#00D4FF" transform="rotate(108 80 80)" filter="url(#glow-cyan)" opacity="0.9" />
    <rect x="76" y="28" width="8" height="12" rx="2" fill="#00D4FF" transform="rotate(144 80 80)" filter="url(#glow-cyan)" opacity="0.9" />
    <rect x="76" y="28" width="8" height="12" rx="2" fill="#00D4FF" transform="rotate(180 80 80)" filter="url(#glow-cyan)" opacity="0.9" />
    <rect x="76" y="28" width="8" height="12" rx="2" fill="#00D4FF" transform="rotate(216 80 80)" filter="url(#glow-cyan)" opacity="0.9" />
    <rect x="76" y="28" width="8" height="12" rx="2" fill="#00D4FF" transform="rotate(252 80 80)" filter="url(#glow-cyan)" opacity="0.9" />
    <rect x="76" y="28" width="8" height="12" rx="2" fill="#00D4FF" transform="rotate(288 80 80)" filter="url(#glow-cyan)" opacity="0.9" />
    <rect x="76" y="28" width="8" height="12" rx="2" fill="#00D4FF" transform="rotate(324 80 80)" filter="url(#glow-cyan)" opacity="0.9" />
  </g>

  <!-- Inner Rim -->
  <circle cx="80" cy="80" r="34" fill="#04070c" stroke="#00F0FF" stroke-width="2" filter="url(#glow-cyan)" />
  <circle cx="80" cy="80" r="28" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Vibranium Arc Core (Pulsing) -->
  <g class="core-pulse">
    <circle cx="80" cy="80" r="22" fill="url(#core-grad)" filter="url(#glow-core)" />
    <!-- Inner bright center -->
    <circle cx="80" cy="80" r="10" fill="#FFFFFF" />
    <polygon points="80,68 89,75 89,85 80,92 71,85 71,75" fill="none" stroke="#00F0FF" stroke-width="1.5" />
  </g>
</svg>
