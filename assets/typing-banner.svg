<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="100%" height="60">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes text-cycle-1 {
      0%, 28% { opacity: 1; transform: translateY(0); }
      33%, 95% { opacity: 0; transform: translateY(-12px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes text-cycle-2 {
      0%, 28% { opacity: 0; transform: translateY(12px); }
      33%, 61% { opacity: 1; transform: translateY(0); }
      66%, 100% { opacity: 0; transform: translateY(-12px); }
    }
    @keyframes text-cycle-3 {
      0%, 61% { opacity: 0; transform: translateY(12px); }
      66%, 95% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-12px); }
    }
    @keyframes blink-cursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .slide-1 {
      animation: text-cycle-1 12s infinite;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    .slide-2 {
      animation: text-cycle-2 12s infinite;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    .slide-3 {
      animation: text-cycle-3 12s infinite;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    .cursor-blink {
      animation: blink-cursor 0.9s infinite;
    }
  </style>

  <!-- Transparent Background: No black box! Works on dark and light GitHub themes -->

  <!-- Slide 1: Cyber Range Title -->
  <g class="slide-1">
    <text x="50%" y="38" text-anchor="middle" font-size="24" font-weight="900" fill="#E62429" letter-spacing="1.5" filter="url(#neon-glow)">
      ⚡ STARK INDUSTRIES SQL — 30 TARGET LABS ACTIVE ⚡
    </text>
  </g>

  <!-- Slide 2: Tech Specs & Capabilities -->
  <g class="slide-2">
    <text x="50%" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#00A8FF" letter-spacing="1.2" filter="url(#neon-glow)">
      🛡️ 4 DATABASE ENGINES · RED TEAM &amp; PENTEST TRAINING PLATFORM
    </text>
  </g>

  <!-- Slide 3: Sharon Anil Cyber Credentials -->
  <g class="slide-3">
    <text x="50%" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#FFB800" letter-spacing="1.2" filter="url(#neon-glow)">
      💀 BUILT BY SHARON ANIL // ETHICAL HACKER &amp; PENTESTER
    </text>
  </g>
</svg>
