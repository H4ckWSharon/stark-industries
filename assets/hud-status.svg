<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="100%" height="90">
  <defs>
    <filter id="hud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse-green {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes bar-sweep {
      0% { width: 10%; }
      50% { width: 85%; }
      100% { width: 10%; }
    }
    .p-green { animation: pulse-green 1.5s infinite; }
    .p-gold { animation: pulse-green 2s infinite; }
    .p-red { animation: pulse-green 1.2s infinite; }
    .meter-bar { animation: bar-sweep 6s ease-in-out infinite; }
  </style>

  <!-- Container Box -->
  <rect x="5" y="5" width="890" height="80" rx="8" fill="#080c14" stroke="#172233" stroke-width="1.5" />

  <!-- Metric 1: 30 Labs -->
  <g transform="translate(25, 18)">
    <circle cx="6" cy="10" r="4" fill="#00FF88" class="p-green" filter="url(#hud-glow)" />
    <text x="18" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8899aa">CHALLENGE LABS</text>
    <text x="18" y="38" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#00FF88" filter="url(#hud-glow)">30 / 30 ONLINE</text>
    <text x="18" y="54" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#556677">Flask + SQLi Containers</text>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="230" y1="18" x2="230" y2="72" stroke="#1c283c" stroke-width="1.5" />

  <!-- Metric 2: 4 DB Engines -->
  <g transform="translate(255, 18)">
    <circle cx="6" cy="10" r="4" fill="#00D4FF" class="p-green" filter="url(#hud-glow)" />
    <text x="18" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8899aa">TARGET DATABASES</text>
    <text x="18" y="38" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#00D4FF" filter="url(#hud-glow)">4 DB ENGINES</text>
    <text x="18" y="54" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#556677">MySQL · PgSQL · MSSQL · SQLite</text>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="475" y1="18" x2="475" y2="72" stroke="#1c283c" stroke-width="1.5" />

  <!-- Metric 3: Pentest Ready -->
  <g transform="translate(500, 18)">
    <circle cx="6" cy="10" r="4" fill="#FFD700" class="p-gold" filter="url(#hud-glow)" />
    <text x="18" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8899aa">PENTEST COMPATIBILITY</text>
    <text x="18" y="38" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#FFD700" filter="url(#hud-glow)">KALI LINUX READY</text>
    <text x="18" y="54" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#556677">sqlmap · Burp · curl · ffuf</text>
  </g>

  <!-- Vertical Divider 3 -->
  <line x1="720" y1="18" x2="720" y2="72" stroke="#1c283c" stroke-width="1.5" />

  <!-- Metric 4: Defense Learning -->
  <g transform="translate(745, 18)">
    <circle cx="6" cy="10" r="4" fill="#FF2244" class="p-red" filter="url(#hud-glow)" />
    <text x="18" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8899aa">LEARNING MODE</text>
    <text x="18" y="38" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#FF2244" filter="url(#hud-glow)">CODE FIXES</text>
    <text x="18" y="54" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#556677">Vulnerable vs Secure Code</text>
  </g>
</svg>
