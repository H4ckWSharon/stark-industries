<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 20" width="100%" height="20">
  <defs>
    <linearGradient id="cyber-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2244" stop-opacity="0" />
      <stop offset="15%" stop-color="#FF2244" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="1" />
      <stop offset="85%" stop-color="#FFD700" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="laser-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>

    <filter id="laser-glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes laser-sweep {
      0% { transform: translateX(-200px); }
      50% { transform: translateX(950px); }
      100% { transform: translateX(-200px); }
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    .laser-beam {
      animation: laser-sweep 4s ease-in-out infinite;
    }
    .pulsing-diamond {
      transform-origin: center;
      animation: pulse-dot 2s infinite;
    }
  </style>

  <!-- Background base line -->
  <line x1="50" y1="10" x2="850" y2="10" stroke="#1a2233" stroke-width="2" />
  
  <!-- Gradient glowing accent line -->
  <line x1="100" y1="10" x2="800" y2="10" stroke="url(#cyber-line-grad)" stroke-width="2" filter="url(#laser-glow)" />

  <!-- High-speed laser scanner pulse -->
  <g class="laser-beam">
    <line x1="0" y1="10" x2="160" y2="10" stroke="url(#laser-pulse)" stroke-width="4" filter="url(#laser-glow)" />
    <circle cx="80" cy="10" r="3" fill="#FFFFFF" filter="url(#laser-glow)" />
  </g>

  <!-- Center tech crosshair -->
  <polygon points="450,4 456,10 450,16 444,10" fill="#00D4FF" class="pulsing-diamond" filter="url(#laser-glow)" />
  <circle cx="200" cy="10" r="2" fill="#FF2244" />
  <circle cx="700" cy="10" r="2" fill="#FFD700" />
</svg>
