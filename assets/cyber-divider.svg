<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 8" width="100%" height="8">
  <defs>
    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E62429" stop-opacity="0" />
      <stop offset="25%" stop-color="#E62429" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFB800" stop-opacity="1" />
      <stop offset="75%" stop-color="#00A8FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00A8FF" stop-opacity="0" />
    </linearGradient>
    <filter id="laser-glow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes laser-pulse {
      0%, 100% { opacity: 0.6; transform: scaleY(1); }
      50% { opacity: 1; transform: scaleY(1.4); }
    }
    .laser-line {
      transform-origin: center;
      animation: laser-pulse 3s ease-in-out infinite;
    }
  </style>

  <!-- Transparent Background -->
  <rect x="0" y="2" width="800" height="4" rx="2" fill="url(#laser-grad)" class="laser-line" filter="url(#laser-glow)" />
</svg>
