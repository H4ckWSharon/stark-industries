<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="240">
  <defs>
    <!-- Glow filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="border-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Card Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0d111d" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <!-- Neon Border Gradient -->
    <linearGradient id="neon-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2244" />
      <stop offset="40%" stop-color="#FFD700" />
      <stop offset="70%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#FF2244" />
    </linearGradient>

    <radialGradient id="avatar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#00F0FF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes pulse-border {
      0%, 100% { stroke-opacity: 0.5; }
      50% { stroke-opacity: 1; }
    }
    @keyframes radar-sweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes blink-cursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes float-badge {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes float-badge-alt {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(3px); }
    }
    @keyframes text-glow {
      0%, 100% { filter: drop-shadow(0 0 2px #FFD700); }
      50% { filter: drop-shadow(0 0 8px #FFD700); }
    }

    .card-border {
      animation: pulse-border 3s ease-in-out infinite;
    }
    .radar {
      transform-origin: 75px 120px;
      animation: radar-sweep 5s linear infinite;
    }
    .blink-dot {
      animation: blink-cursor 1.2s infinite;
    }
    .b1 { animation: float-badge 3s ease-in-out infinite; }
    .b2 { animation: float-badge-alt 3.5s ease-in-out infinite; }
    .b3 { animation: float-badge 3.2s ease-in-out infinite 0.5s; }
    .b4 { animation: float-badge-alt 3.8s ease-in-out infinite 0.7s; }
    .b5 { animation: float-badge 3.4s ease-in-out infinite 0.3s; }
    .glowing-name {
      animation: text-glow 3s ease-in-out infinite;
    }
  </style>

  <!-- Main Card Container -->
  <rect x="10" y="10" width="830" height="220" rx="14" fill="url(#card-bg)" stroke="#1a2333" stroke-width="2" />
  <!-- Neon Accent Border -->
  <rect x="10" y="10" width="830" height="220" rx="14" fill="none" stroke="url(#neon-border-grad)" stroke-width="2" class="card-border" filter="url(#border-glow)" />

  <!-- Corner Tech Accents -->
  <polygon points="10,25 25,10 35,10 10,35" fill="#FF2244" opacity="0.8" />
  <polygon points="840,25 825,10 815,10 840,35" fill="#FFD700" opacity="0.8" />
  <polygon points="10,215 25,230 35,230 10,205" fill="#00D4FF" opacity="0.8" />
  <polygon points="840,215 825,230 815,230 840,205" fill="#FF2244" opacity="0.8" />

  <!-- Left: Cyber Radar / Operator HUD Avatar -->
  <circle cx="75" cy="120" r="50" fill="url(#avatar-glow)" />
  <circle cx="75" cy="120" r="45" fill="#0a0f18" stroke="#1f2c3f" stroke-width="1.5" />
  <circle cx="75" cy="120" r="32" fill="none" stroke="#00D4FF" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
  <circle cx="75" cy="120" r="18" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.8" />
  <circle cx="75" cy="120" r="4" fill="#00F0FF" filter="url(#neon-glow)" />

  <!-- Radar sweep arm -->
  <g class="radar">
    <line x1="75" y1="120" x2="75" y2="76" stroke="#00F0FF" stroke-width="1.5" filter="url(#neon-glow)" />
    <polygon points="75,120 70,78 75,76" fill="#00F0FF" opacity="0.3" />
  </g>

  <!-- Crosshairs -->
  <line x1="75" y1="68" x2="75" y2="172" stroke="#1a2536" stroke-width="1" />
  <line x1="23" y1="120" x2="127" y2="120" stroke="#1a2536" stroke-width="1" />

  <!-- Operator Status Badge -->
  <rect x="145" y="32" width="175" height="22" rx="4" fill="#00FF88" fill-opacity="0.12" stroke="#00FF88" stroke-width="1" />
  <circle cx="157" cy="43" r="3.5" fill="#00FF88" class="blink-dot" filter="url(#neon-glow)" />
  <text x="168" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#00FF88" letter-spacing="1">SYSTEM OPERATOR</text>

  <!-- Verified Security Stamp -->
  <rect x="690" y="32" width="130" height="22" rx="4" fill="#FF2244" fill-opacity="0.12" stroke="#FF2244" stroke-width="1" />
  <text x="702" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#FF2244" letter-spacing="1">🛡️ RED TEAM LABS</text>

  <!-- Sharon Anil Title -->
  <text x="145" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">Built by <tspan fill="#FFD700" class="glowing-name">Sharon Anil</tspan></text>
  
  <!-- Subtitle -->
  <text x="145" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#00D4FF" letter-spacing="1.2">⚡ ETHICAL HACKER &amp; PENTESTER</text>

  <!-- Animated Skill Badges Row -->
  <!-- Badge 1: CTF Player -->
  <g class="b1" transform="translate(145, 126)">
    <rect width="115" height="28" rx="6" fill="#141a28" stroke="#00D4FF" stroke-width="1" />
    <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#00D4FF">🚩 CTF Player</text>
  </g>

  <!-- Badge 2: Web Developer -->
  <g class="b2" transform="translate(270, 126)">
    <rect width="138" height="28" rx="6" fill="#141a28" stroke="#00FF88" stroke-width="1" />
    <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#00FF88">💻 Web Developer</text>
  </g>

  <!-- Badge 3: Hardware Hacking -->
  <g class="b3" transform="translate(418, 126)">
    <rect width="158" height="28" rx="6" fill="#141a28" stroke="#FF8800" stroke-width="1" />
    <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#FF8800">🔌 Hardware Hacking</text>
  </g>

  <!-- Badge 4: Exploit Dev -->
  <g class="b4" transform="translate(586, 126)">
    <rect width="118" height="28" rx="6" fill="#141a28" stroke="#FF2244" stroke-width="1" />
    <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#FF2244">💀 Exploit Dev</text>
  </g>

  <!-- Badge 5: Red Teamer -->
  <g class="b5" transform="translate(714, 126)">
    <rect width="105" height="28" rx="6" fill="#141a28" stroke="#FFD700" stroke-width="1" />
    <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#FFD700">🎯 Red Team</text>
  </g>

  <!-- Bottom channel info bar -->
  <rect x="145" y="172" width="675" height="38" rx="6" fill="#0a0e17" stroke="#1f293d" stroke-width="1" />
  
  <text x="160" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FF4444">📺 YouTube Channel:</text>
  <text x="295" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#00D4FF">https://www.youtube.com/@HackWSharon</text>

  <text x="590" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#999999">🐙 GitHub:</text>
  <text x="655" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#FFD700">@H4ckWSharon</text>
</svg>
